  - {ncdc: "1.3", reason: "Pericarditis: dataset marks the section partial_ambiguous"}
  - {ncdc: "2.1", reason: "Brain abscess: no executable regimen; durations depend on lesion response"}
  - {ncdc: "2.2", reason: "Encephalitis: no executable regimen; antiviral-led"}
