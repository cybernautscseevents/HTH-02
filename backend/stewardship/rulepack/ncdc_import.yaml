# Which rows of the NCDC 2025 dataset become which syndrome codes.
#
# The dataset (data/reference/ncdc/syndromes_ncdc_2025.yaml) lists every regimen of a guideline
# section together, each tagged with the sub-group it applies to ("non-purulent", "with sepsis",
# "ICU with Pseudomonas risk"). Our engine has no sub-groups: one syndrome code is one table the
# clinician selects. So each code below names exactly the dataset regimens that belong to it.
# The grouping is decided here, by hand, from the dataset's own sub-group labels; nothing is
# grouped automatically. The dataset's structured `applies_when.predicate` is NOT used: it is
# wrong in places (e.g. "uncomplicated" rows tagged severity=complicated).
#
# scripts/import_ncdc.py converts the regimens named here into rulepack/syndromes_ncdc.yaml and
# writes docs/NCDC_IMPORT_REPORT.md listing every dataset row that was not imported and why.
#
# Fields
#   code, name        our syndrome code and display name
#   ncdc              dataset syndrome id (the guideline section number)
#   regimens          dataset regimen ids (first_line / alternative rows only)
#   no_antibiotic     dataset regimen id of a "no antibiotic" row; the code then has
#                     antibiotics_indicated: false and no regimens
#   culture_basis     set only when the section itself says to collect a culture before
#                     antibiotics; the text is copied from the dataset and makes the code
#                     culture_required. The dataset's per-regimen culture flag is not used: it
#                     comes from one general instruction (GUIDE-001) applied to every row.
#   covered_by        the section is already in the hand-checked rulepack/syndromes.yaml under
#                     that code. It is compared, never imported, and the hand-checked row wins.

