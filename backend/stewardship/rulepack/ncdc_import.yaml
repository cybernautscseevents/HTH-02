  - {ncdc: "3.4", reason: "Sepsis syndrome: no executable regimen; dataset marks the section partial_ambiguous"}
  - {ncdc: "4.1", reason: "Oesophagitis: antifungal treatment, outside the antibiotic engine"}
  - {ncdc: "4.3", reason: "Hepatitis: guideline refers to an external guideline"}
  - {ncdc: "4.8", reason: "Splenic abscess: only one executable regimen; stable patients defer treatment"}
  - {ncdc: "6.1", reason: "Genital ulcers: guideline refers to the national STI guideline"}
  - {ncdc: "6.2", reason: "Anogenital warts: guideline refers to the national STI guideline"}
  - {ncdc: "6.4", reason: "Vaginal discharge: guideline refers to the national STI guideline"}
  - {ncdc: "6.6", reason: "Pelvic inflammatory disease: guideline refers to the national STI guideline"}
  - {ncdc: "6.9", reason: "Urethral discharge: guideline refers to the national STI guideline"}
  - {ncdc: "8.1", reason: "Oropharyngeal candidiasis: antifungal treatment, outside the antibiotic engine"}
  - {ncdc: "10.2", reason: "Chronic osteomyelitis: cross-reference to 10.1 only"}
  - {ncdc: "10.4", reason: "Septic arthritis: cross-reference to 10.1; only the gonococcal row is concrete"}
  - {ncdc: "10.6", reason: "Orthopaedic implant infection: cross-reference to 10.1 and culture-targeted therapy"}
  - {ncdc: "10.7", reason: "Surgical prophylaxis: single pre-incision doses; the engine's dose and duration rules are written for treatment courses"}
  - {ncdc: "11.1", reason: "Conjunctivitis/keratitis: ophthalmic routes the engine does not model"}
  - {ncdc: "11.2", reason: "Endophthalmitis: intravitreal routes; dataset preserves a conflicting amikacin dose"}
