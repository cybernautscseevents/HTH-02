[project]
name = "hacktopia-hc03"
version = "0.1.0"
description = "Antibiotic stewardship copilot (Hackatopia 2026, HC-03)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# The superseded RxGuard pipeline (legacy/, see legacy/README.md) and one-off data scripts are
# not part of the application and are not linted with it. docs/ holds design notes whose code
# snippets are illustrations, not code.
extend-exclude = [
    "docs",
    "legacy",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
